name: Link preview check
on:
  push:
    branches: ['meta-check-*']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pages like Messenger does
        run: |
          exec > >(tee /tmp/out.txt) 2>&1
          for u in $(cat urls.txt); do
            echo "=================== $u"
            curl -s -L -A "facebookexternalhit/1.1" -o /tmp/p.html -w "status %{http_code} type %{content_type} final %{url_effective}\n" "$u" || true
            grep -oE '<title>[^<]*</title>|<meta (property|name)="(og:[a-z:]+|twitter:[a-z]+|description)" content="[^"]*"' /tmp/p.html | head -20
            grep -o 'location.replace([^)]*)' /tmp/p.html | head -2
          done
          echo "=== js bundle mentions supabase.co?"
          JS=$(curl -s https://multi-tenant-mirella-babyshower.mirandella.workers.dev/ | grep -oE '/assets/index-[^"]+\.js' | head -1)
          echo "js: $JS"; curl -s "https://multi-tenant-mirella-babyshower.mirandella.workers.dev$JS" | grep -oE 'https://[a-z0-9]+\.supabase\.co|project-not-configured' | sort -u
      - name: Save the result to the meta-check-results branch
        if: always()
        run: |
          mkdir /tmp/r && cp /tmp/out.txt /tmp/r/out.txt && cd /tmp/r
          git init -q -b meta-check-results && git config user.name ci && git config user.email ci@example.com
          git add -A && git commit -qm "meta check" && git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" meta-check-results
