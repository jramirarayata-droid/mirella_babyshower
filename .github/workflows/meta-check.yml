name: Link preview check
on:
  push:
    branches: ['meta-check-*']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pages like Messenger does
        run: |
          exec > >(tee /tmp/out.txt) 2>&1
          for u in $(cat urls.txt); do
            echo "=================== $u"
            curl -s -L -A "facebookexternalhit/1.1" -o /tmp/p.html -w "status %{http_code} type %{content_type} final %{url_effective}\n" "$u" || true
            grep -oE '<title>[^<]*</title>|<meta (property|name)="(og:[a-z:]+|twitter:[a-z]+|description)" content="[^"]*"' /tmp/p.html | head -20
            grep -o 'location.replace([^)]*)' /tmp/p.html | head -2
          done
          echo "=================== config + direct calls"
          C=$(curl -s https://multi-tenant-mirella-babyshower.mirandella.workers.dev/site-config.json)
          echo "config keys: $(echo "$C" | jq -r 'keys|join(",")' 2>&1) url: $(echo "$C" | jq -r .supabaseUrl 2>&1)"
          U=$(echo "$C" | jq -r .supabaseUrl); K=$(echo "$C" | jq -r .anonKey)
          if [ -n "$U" ] && [ "$U" != null ]; then
            echo "space_here:"; curl -s -X POST "$U/rest/v1/rpc/space_here" -H "apikey: $K" -H "Authorization: Bearer $K" -H "Content-Type: application/json" -H "x-space: mirella" -d '{}' | head -c 600; echo
            echo "settings:"; curl -s "$U/rest/v1/wedding_settings?select=baby_name,wedding_date&limit=1" -H "apikey: $K" -H "Authorization: Bearer $K" -H "x-space: mirella" | head -c 300; echo
          fi
      - name: Save the result to the meta-check-results branch
        if: always()
        run: |
          mkdir /tmp/r && cp /tmp/out.txt /tmp/r/out.txt && cd /tmp/r
          git init -q -b meta-check-results && git config user.name ci && git config user.email ci@example.com
          git add -A && git commit -qm "meta check" && git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" meta-check-results
